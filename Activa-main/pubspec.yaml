name: activa
description: "ACTIVA: Activación de Clubes y Talleres Institucionales para la Vida Académica."
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: ^3.13.5

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  cupertino_icons: ^1.0.8
  go_router: ^18.0.2
  provider: ^6.1.5+1
  google_fonts: ^6.2.1
  audioplayers: ^6.1.0
  intl: any
  qr_flutter: ^4.1.0
  image_picker: ^1.1.2

  pdf: ^3.11.1
  archive: ^3.6.1
  file_saver: ^0.2.14
  url_launcher: ^6.3.1
  share_plus: ^11.0.0

    # cuentas guardadas en JSON + contraseñas con hash
  crypto: ^3.0.7
  path_provider: ^2.1.6
  shared_preferences: ^2.5.6

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/talleres/
    - assets/sounds/
  # Tipografía Century. Por ahora son archivos libres parecidos a Century Gothic.
  # Para usar la original, copia GOTHIC.TTF y GOTHICB.TTF de C:\Windows\Fonts
  # a assets/fonts/ y cambia los nombres de archivo aquí abajo.
  fonts:
    - family: Century
      fonts:
        - asset: assets/fonts/Century-Regular.otf
        - asset: assets/fonts/Century-Bold.otf
          weight: 700